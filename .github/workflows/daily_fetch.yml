name: Daily Fetch

on:
  schedule:
    - cron: "0 8 * * *"   # 8am UTC every day
  workflow_dispatch:        # allow manual trigger

# Serialize with the send job to prevent simultaneous state-file commits.
concurrency:
  group: state-files
  cancel-in-progress: false

permissions:
  contents: write           # needed to commit seen_ids.json and pending.json back

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch and filter papers
        run: python main_fetch.py

      - name: Commit updated state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_ids.json pending.json
          git diff --staged --quiet || git commit -m "chore: update state after daily fetch [skip ci]"
          git push
