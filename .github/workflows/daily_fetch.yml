name: Daily Fetch

on:
  schedule:
    - cron: "0 8 * * *"   # 8am UTC every day
  workflow_dispatch:        # allow manual trigger

# Serialize with the send job to prevent simultaneous state-file commits.
concurrency:
  group: state-files
  cancel-in-progress: false

permissions:
  contents: write           # needed to commit seen_ids.json and pending.json back

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Cache the sentence-transformers model (~90 MB) to avoid re-downloading
      # on every run. Keyed on model name so a model upgrade busts the cache.
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch/sentence_transformers
          key: hf-all-MiniLM-L6-v2-${{ runner.os }}

      # Install CPU-only torch first to avoid pulling the ~2 GB CUDA build.
      - name: Install torch (CPU)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch and filter papers
        run: python main_fetch.py

      - name: Commit updated state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_ids.json pending.json
          git diff --staged --quiet || git commit -m "chore: update state after daily fetch [skip ci]"
          git push
